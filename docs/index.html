<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三線跑酷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="480" height="640"></canvas>

    <!-- HUD: shown while playing -->
    <div id="hud">
      <span id="score-display">分數：0</span>
      <span id="level-display">Lv.1</span>
      <span id="best-display">最高：0</span>
    </div>

    <!-- Touch controls: shown while playing -->
    <div id="touch-controls" class="hidden">
      <button id="btn-left" aria-label="向左換道">&#9664;</button>
      <button id="btn-right" aria-label="向右換道">&#9654;</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <h1>三線跑酷</h1>
      <p id="start-best">歷史最高分：0</p>
      <p>每 100 分速度提升一級</p>
      <p>← → 方向鍵 或 滑動螢幕切換跑道</p>
      <button id="start-btn">開始遊戲</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay hidden">
      <h1>遊戲結束</h1>
      <p id="final-score">最終分數：0</p>
      <p id="gameover-level">到達等級：Lv.1</p>
      <p id="new-best" class="hidden new-best-label">🏆 新紀錄！</p>
      <p id="gameover-best">歷史最高分：0</p>
      <button id="restart-btn">重新開始</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
